# Once a week: copy the list of posts from Substack into posts.html and republish the site.
# To run it right away: Actions tab -> "Update posts" -> "Run workflow".

name: Update posts

on:
  schedule:
    - cron: "30 13 * * 1"   # Mondays, 13:30 UTC (morning in the US)
  workflow_dispatch:

permissions:
  contents: write   # save the updated posts.html
  pages: write      # ask GitHub Pages to republish the site

concurrency:
  group: update-posts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Read the Substack feed
        run: python3 build.py --posts

      - name: Save and republish if the list changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- posts.html; then
            echo "No new posts."
            [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || exit 0
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posts.html
            git commit -m "Update posts from Substack"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          # A push made by this job does not start a Pages build by itself, so request one.
          # Manual runs always request one, so "Run workflow" also refreshes the live site.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
