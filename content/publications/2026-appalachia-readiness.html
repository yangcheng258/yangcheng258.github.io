<div class="abstract">
<p>This paper develops a readiness index of the workforce for the green transition, with a focus on Appalachia. Drawing on the Occupational Greenness Potential measures, the index summarizes how prepared local labor markets are, given their current occupation and skill mix, to take up green work.</p>
