<!doctype html>
<!--
PUBLICATION TEMPLATE
====================
Copy this file: cp _template.html YYYY-slug.html  (e.g. 2026-pirs-methods.html)
Edit the meta tags below + the abstract paragraph in <body>. Run `python3 build.py` from the project root.

The build script will inject this paper into wherever pub:sections names — see allowed values below.
-->
<html><head>
<meta name="pub:type"     content="article">
<!-- type: article | working-paper | book-chapter | dissertation | report -->

<meta name="pub:title"    content="[Paper title]">
<meta name="pub:authors"  content="[Full Name, Full Name & Full Name]">
<meta name="pub:venue"    content="[Journal name + volume/issue OR 'Working paper, targeting X' OR 'Book chapter']">
<meta name="pub:year"     content="2026">
<meta name="pub:status"   content="in-progress">
<!-- status: published | in-revision | in-progress | drafted -->

<meta name="pub:themes"   content="rural">
<!-- themes (space-separated): rural | qol | green | housing | health | datasci | ai -->

<meta name="pub:sections" content="livability">
<!-- sections (comma-separated): which theme pages feature this paper.
     Options: livability | workforce | migration -->

<meta name="pub:pdf"      content="">
<meta name="pub:slides"   content="">
<meta name="pub:doi"      content="">
<meta name="pub:code"     content="">
<meta name="pub:data"     content="">
<meta name="pub:cite"     content="">
</head><body>
<div class="abstract">
<p>[Write the abstract here. One or more &lt;p&gt; paragraphs. Shown when the paper row is expanded on the theme pages.]</p>
</div>
</body></html>
